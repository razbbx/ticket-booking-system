<!DOCTYPE html>
<html lang="en-IN" data-input-modality="pointer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="Real-time Movie & Concert Ticket Booking Platform with visual seat selection, instant TTL seat holds, automated waitlist reallocation, and QR tickets.">
  <title>Ticket Booking System - Movies & Concerts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="https://assets-in.bmscdn.com/webin/common/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="#/events" class="brand" data-nav="home">
        <span class="brand-icon">🎟️</span>
        <span>Ticket Pass</span>
      </a>
      <nav class="nav-links" id="navLinks"></nav>
      <div class="nav-user" id="navUser"></div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="view" class="container" aria-live="polite"></main>

  <!-- Toast Notification Region -->
  <div id="toastRegion" aria-live="assertive"></div>

  <!-- Reusable Confirm Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal-box">
      <h3 id="modalTitle" style="font-size: 20px; font-weight: 700; margin-bottom: 12px;">Confirm Action</h3>
      <p id="modalBody" style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;"></p>
      <div style="display: flex; gap: 12px; justify-content: flex-end;">
        <button type="button" id="modalCancel" class="btn btn-secondary">Cancel</button>
        <button type="button" id="modalOk" class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
